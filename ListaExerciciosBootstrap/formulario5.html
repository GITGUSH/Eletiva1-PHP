<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Billing address</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<form  class="container py-5" style="background:#f8f9fa; padding:24px; max-width:700px; border-radius:6px; margin:0 auto;">
<table style="table-layout:fixed; width:100%;">


  <caption style="caption-side:top; text-align:left;">
    <h4 class="mb-3">Billing address</h4>
  </caption>

  <thead>
    <tr>
      <th class="pb-1" colspan="3" style="text-align:left; font-weight:normal;"><label for="firstName">First name</label></th>
      <th class="pb-1" colspan="3" style="text-align:left; font-weight:normal;"><label for="lastName">Last name</label></th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td class="pe-3 pb-3" colspan="3"><input type="text" class="form-control" id="firstName"></td>
      <td class="pb-3" colspan="3"><input type="text" class="form-control" id="lastName"></td>
    </tr>
  </tbody>

  <thead>
    <tr>
      <th class="pb-1" colspan="6" style="text-align:left; font-weight:normal;"><label for="username">Username</label></th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td class="pb-3" colspan="6">
        <table style="width:100%;">
          <tr>
            
            <td style="width:40px;" class="input-group-text">@</td>
            <td><input type="text" class="form-control" id="username" placeholder="Username"></td>
          </tr>
        </table>
      </td>
    </tr>
  </tbody>

  <thead>
    <tr>
      <th class="pb-1" colspan="6" style="text-align:left; font-weight:normal;"><label for="email">Email <span class="text-muted">(Optional)</span></label></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="pb-3" colspan="6"><input type="email" class="form-control" id="email" placeholder="you@example.com"></td>
    </tr>
  </tbody>

  <thead>
    <tr>
      <th class="pb-1" colspan="6" style="text-align:left; font-weight:normal;"><label for="address">Address</label></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="pb-3" colspan="6"><input type="text" class="form-control" id="address" placeholder="1234 Main St"></td>
    </tr>
  </tbody>

  <thead>
    <tr>
      <th class="pb-1" colspan="6" style="text-align:left; font-weight:normal;"><label for="address2">Address 2 <span class="text-muted">(Optional)</span></label></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="pb-3" colspan="6"><input type="text" class="form-control" id="address2" placeholder="Apartment or suite"></td>
    </tr>
  </tbody>

  <thead>
    <tr>
      <th class="pb-1" colspan="2" style="text-align:left; font-weight:normal;"><label for="country">Country</label></th>
      <th class="pb-1" colspan="2" style="text-align:left; font-weight:normal;"><label for="state">State</label></th>
      <th class="pb-1" colspan="2" style="text-align:left; font-weight:normal;"><label for="zip">Zip</label></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="pe-3 pb-3" colspan="2">
        <select class="form-select" id="country">
          <option selected>Choose...</option>
          <option value="brasil">Brasil</option>
        </select>
      </td>
      <td class="pe-3 pb-3" colspan="2">
        <select class="form-select" id="state">
          <option selected>Choose...</option>
          <option value="sp">SP</option>
        </select>
      </td>
      <td class="pb-3" colspan="2"><input type="text" class="form-control" id="zip"></td>
    </tr>
  </tbody>
</table>
</form>
</body>
</html>
