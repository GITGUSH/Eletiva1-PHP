<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novo Usuário</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>


<form class="container py-5">
<table style="table-layout:fixed; width:900px;">


  <caption style="caption-side:top; text-align:left;">
    <h2 class="mb-4">Novo Usuário</h2>
  </caption>

  <thead>
    <tr>
      <th class="pb-1" colspan="3" style="text-align:left; font-weight:normal;"><label for="nome">Nome:</label></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="pb-3" colspan="3"><input type="text" class="form-control" id="nome" placeholder="Informe o nome..."></td>
    </tr>
  </tbody>

  <thead>
    <tr>
      <th class="pb-1" style="text-align:left; font-weight:normal;"><label for="cpf">CPF:</label></th>
      <th class="pb-1" style="text-align:left; font-weight:normal;"><label for="endereco">Endereço:</label></th>
      <th class="pb-1" style="text-align:left; font-weight:normal;"><label for="nivel">Nível:</label></th>
    </tr>
  </thead>

  <tbody>

    <tr>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="cpf" placeholder="Informe o cpf..."></td>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="endereco" placeholder="Informe o endereço..."></td>
      <td class="pb-3">
        <select class="form-select" id="nivel">
          <option selected>---</option>
          <option value="admin">Admin</option>
          <option value="usuario">Usuário</option>
        </select>
      </td>
    </tr>
  </tbody>

  <thead>
    <tr>
      <th class="pb-1" style="text-align:left; font-weight:normal;"><label for="email">Email:</label></th>
      <th class="pb-1" style="text-align:left; font-weight:normal;"><label for="senha">Senha:</label></th>
      <th class="pb-1" style="text-align:left; font-weight:normal;"><label for="status">Status:</label></th>
    </tr>
  </thead>

  <tbody>
    <tr>
      <td class="pe-3 pb-3"><input type="email" class="form-control" id="email" placeholder="Informe o email..."></td>
      <td class="pe-3 pb-3"><input type="password" class="form-control" id="senha" placeholder="Informe a senha..."></td>
      <td class="pb-3">
        <select class="form-select" id="status">
          <option selected>---</option>
          <option value="ativo">Ativo</option>
          <option value="inativo">Inativo</option>
        </select>
      </td>
    </tr>
  </tbody>

  <tfoot>
    <tr>
      <td colspan="3" class="pt-2" style="text-align:right;">
        <button type="submit" class="btn btn-success">Enviar</button>
        <button type="button" class="btn btn-secondary">Cancelar</button>
      </td>
    </tr>
  </tfoot>
</table>

</form>
</body>
</html>
