<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sample Form</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<form class="container py-5">
<table style="table-layout:fixed; width:960px; margin:0 auto;">

        <caption style="caption-side:top; text-align:center;">
    <h2 class="mb-4">Sample Form</h2>
        </caption>

     <tbody>
        <tr>
            <td class="pb-3 pe-2" style="text-align:right; font-weight:bold;"><label for="partnerName">Partner Name</label></td>
            <td class="pb-3 pe-4"><input type="text" class="form-control" id="partnerName"></td>
            <td class="pb-3 pe-2" style="text-align:right; font-weight:bold;"><label for="partnerEmail">Partner Email ID</label></td>
            <td class="pb-3"><input type="email" class="form-control" id="partnerEmail"></td>
        </tr>
    <tr>
      <td class="pb-3 pe-2" style="text-align:right; font-weight:bold;"><label for="partnerLegalName">Partner Legal Name</label></td>
      <td class="pb-3 pe-4"><input type="text" class="form-control" id="partnerLegalName"></td>
      <td class="pb-3 pe-2" style="text-align:right; font-weight:bold;"><label for="partnerMobile">Partner Mobile</label></td>
      <td class="pb-3"><input type="text" class="form-control" id="partnerMobile"></td>
    </tr>
    <tr>
      <td class="pb-3 pe-2" style="text-align:right; font-weight:bold; vertical-align:top;"><label for="partnerAddress">Partner Address</label></td>
      <td class="pb-3" colspan="3"><textarea class="form-control" id="partnerAddress" rows="3"></textarea></td>
    </tr>
    <tr>
      <td class="pb-3 pe-2" style="text-align:right; font-weight:bold;"><label for="startDate">Contract Start Date</label></td>
      <td class="pb-3 pe-4"><input type="text" class="form-control" id="startDate" placeholder="Date Start"></td>
      <td class="pb-3 pe-2" style="text-align:right; font-weight:bold;"><label for="endDate">Contract Expiry Date</label></td>
      <td class="pb-3"><input type="text" class="form-control" id="endDate" placeholder="Date End"></td>
    </tr>
    <tr>
      <td class="pb-3 pe-2" style="text-align:right; font-weight:bold;"><label for="minLoan">Minimum Loan Amount</label></td>
      <td class="pb-3 pe-4"><input type="text" class="form-control" id="minLoan"></td>
      <td class="pb-3 pe-2" style="text-align:right; font-weight:bold;"><label for="maxLoan">Maximum Loan Amount</label></td>
      <td class="pb-3"><input type="text" class="form-control" id="maxLoan"></td>
    </tr>
    <tr>
      <td class="pb-3 pe-2" style="text-align:right; font-weight:bold;"><label for="interestRate">Interest Rate</label></td>
      <td class="pb-3 pe-4"><input type="text" class="form-control" id="interestRate"></td>
      <td class="pb-3 pe-2" style="text-align:right; font-weight:bold;"><label for="depositAmount">Deposit Amount</label></td>
      <td class="pb-3"><input type="text" class="form-control" id="depositAmount"></td>
    </tr>
  </tbody>

        <tfoot>
            <tr>
              <td colspan="4" class="pt-2" style="text-align:center;">
            <button type="submit" class="btn btn-primary">Save</button>
            </td>
            </tr>
        </tfoot>
</table>
</form>
</body>
</html>
