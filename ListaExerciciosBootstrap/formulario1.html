<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<form class="container py-5" style="max-width: 900px;" action="" method="post">
<table class="w-100">
  <thead>
    <tr>
      <th class="pb-1"><label for="firstName" class="form-label">First name</label></th>
      <th class="pb-1"><label for="lastName" class="form-label">Last name</label></th>
      <th class="pb-1"><label for="username" class="form-label">Username</label></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="firstName" value="Mark"></td>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="lastName" value="Otto"></td>
      <td class="pb-3">
        <table>
          <tr>
            <td class="input-group-text">@</td>
            <td class="w-100"><input type="text" class="form-control" id="username" placeholder="Username"></td>
          </tr>
        </table>
      </td>
    </tr>
  </tbody>
  <thead>
    <tr>
      <th class="pb-1"><label for="city" class="form-label">City</label></th>
      <th class="pb-1"><label for="state" class="form-label">State</label></th>
      <th class="pb-1"><label for="zip" class="form-label">Zip</label></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="city" placeholder="City"></td>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="state" placeholder="State"></td>
      <td class="pb-3"><input type="text" class="form-control" id="zip" placeholder="Zip"></td>
    </tr>
  </tbody>
  <tbody>
    <tr>
      <td colspan="3" class="pb-3">
        <input type="checkbox" class="form-check-input" id="terms">
        <label class="form-check-label" for="terms">Agree to terms and conditions</label>
      </td>
    </tr>
    <tr>
      <td colspan="3">
        <button type="submit" class="btn btn-primary">Submit form</button>
      </td>
    </tr>
  </tbody>
</table>
</form>
</body>
</html>
