<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Cliente</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<form class="container py-5" action="" method="post">
<table style="table-layout:fixed; width:940px;">
  <thead>
    <tr>
      <th class="pb-1" style="text-align:left;"><label for="codigo" class="form-label">Código</label></th>
      <th class="pb-1" colspan="2" style="text-align:left;"><label for="nome" class="form-label">Nome</label></th>
      <th class="pb-1" colspan="2" style="text-align:left;"><label for="email" class="form-label">E-mail</label></th>
      <th class="pb-1" style="text-align:left;"><label for="cpf" class="form-label">CPF</label></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="codigo" value="32" disabled></td>
      <td class="pe-3 pb-3" colspan="2"><input type="text" class="form-control" id="nome" placeholder="Nome Completo do Cliente"></td>
      <td class="pe-3 pb-3" colspan="2"><input type="email" class="form-control" id="email" placeholder="cliente@dominio.com"></td>
      <td class="pb-3"><input type="text" class="form-control" id="cpf" placeholder="Só números"></td>
    </tr>
  </tbody>

  <thead>
    <tr>
      <th class="pb-1" style="text-align:left;"><label for="celular" class="form-label">Nº Celular</label></th>
      <th class="pb-1" style="text-align:left;"><label for="fixo" class="form-label">Nº Telefone fixo</label></th>
      <th class="pb-1" style="text-align:left;"><label for="cep" class="form-label">CEP</label></th>
      <th class="pb-1" style="text-align:left;"><label for="logradouro" class="form-label">Logradouro</label></th>
      <th class="pb-1" style="text-align:left;"><label for="numero" class="form-label">Nº</label></th>
      <th class="pb-1" style="text-align:left;"><label for="bairro" class="form-label">Bairro</label></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="celular" placeholder="Nº do celular"></td>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="fixo" placeholder="Nº telefone"></td>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="cep" placeholder="ex:88308070"></td>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="logradouro" placeholder="ex:Rua 1400,"></td>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="numero" placeholder="Nº"></td>
      <td class="pb-3"><input type="text" class="form-control" id="bairro" placeholder="Bairro"></td>
    </tr>
  </tbody>

  <thead>
    <tr>
      <th class="pb-1" colspan="2" style="text-align:left;"><label for="cidade" class="form-label">Cidade</label></th>
      <th class="pb-1" style="text-align:left;"><label for="uf" class="form-label">UF</label></th>
      <th class="pb-1" colspan="2" style="text-align:left;"><label for="status" class="form-label">Status</label></th>
      <th class="pb-1"></th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td class="pe-3 pb-3" colspan="2"><input type="text" class="form-control" id="cidade" placeholder="Cidade"></td>
      <td class="pe-3 pb-3"><input type="text" class="form-control" id="uf" placeholder="UF"></td>
      <td class="pe-3 pb-3" colspan="2">
        <select class="form-select" id="status">
          <option selected disabled>Selecione</option>
          <option value="ativo">Ativo</option>
          <option value="inativo">Inativo</option>
        </select>
      </td>
      <td class="pb-3"></td>
    </tr>
  </tbody>

  <tbody>
    <tr>
      <td colspan="6" class="pt-3" style="text-align:right;">
        <button type="reset" class="btn btn-danger">Resetar</button>
        <button type="submit" class="btn btn-success">Próximo</button>
      </td>
    </tr>
  </tbody>
</table>
</form>
</body>
</html>
